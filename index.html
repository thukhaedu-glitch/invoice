
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

<!-- ── TOPBAR ─────────────────────────────── -->
<div class="fixed top-4 right-4 z-50 flex gap-2 no-print" id="topbar-actions">
    <button onclick="app.toggleLang()"
        class="bg-white border shadow-sm px-3 py-1.5 rounded-full text-sm font-bold hover:bg-gray-50 flex items-center gap-1">
        <span id="lang-icon">🇬🇧</span><span id="lang-text">EN</span>
    </button>
</div>

<main class="w-full max-w-6xl mx-auto p-2 md:p-4" id="main-container"></main>
<div id="modal-container"></div>

<!-- File inputs -->
<input type="file" id="item-image-input"     hidden accept="image/*" onchange="app.processItemImage(this)">
<input type="file" id="contract-image-input" hidden accept="image/*" onchange="app.processContractImage(this)">
<input type="file" id="setting-logo-input"   hidden accept="image/*" onchange="app.processLogo(this)">
<input type="file" id="setting-sign-input"   hidden accept="image/*" onchange="app.processSign(this)">

<!-- QR Scanner Modal -->
<div id="scanner-modal" class="fixed inset-0 bg-black bg-opacity-90 hidden z-[60] flex flex-col items-center justify-center p-4">
    <div class="bg-white p-4 rounded-xl w-full max-w-md relative">
        <button onclick="app.stopScanner()" class="absolute top-2 right-2 text-gray-500 hover:text-red-500"><i data-lucide="x"></i></button>
        <h3 class="text-center font-bold mb-4" data-translate="scan_qr">Scan QR Code</h3>
        <div id="reader" style="width:100%"></div>
    </div>
</div>

<!-- ═══════════════════════════════════════════
     TEMPLATES
═══════════════════════════════════════════ -->

<!-- HOME -->
<template id="tpl-home">
<div class="flex flex-col items-center justify-center py-4 text-center space-y-6 fade-in min-h-[80vh]">
    <div class="mb-4">
        <div class="bg-blue-600 text-white p-3 rounded-2xl inline-block shadow-lg mb-3">
            <i data-lucide="file-text" width="32" height="32"></i>
        </div>
        <h1 class="font-bold text-xl text-blue-900">Invoice SaaS</h1>
    </div>
    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900" data-translate="verify_payment_title">Verify Payment</h2>
    <div class="w-full max-w-md space-y-6">
        <div class="bg-white p-6 rounded-xl shadow border">
            <label class="block text-left text-sm font-medium text-gray-700 mb-2" data-translate="method_1">Method 1</label>
            <div class="flex gap-2">
                <input type="text" id="search-input" placeholder="INV-xxx / QTN-xxx / SEC-xxx"
                    class="flex-1 border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-sm">
                <button onclick="app.handleSearch()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium text-sm" data-translate="check_btn">Check</button>
            </div>
        </div>
        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="flex-shrink-0 mx-4 text-gray-400 text-xs">OR</span>
            <div class="flex-grow border-t border-gray-300"></div>
        </div>
        <button onclick="app.startScanner()"
            class="w-full bg-gray-800 hover:bg-gray-900 text-white p-5 rounded-xl shadow-lg flex items-center justify-center gap-3">
            <i data-lucide="qr-code" width="28" height="28"></i>
            <div class="text-left">
                <div class="font-bold text-base" data-translate="method_2">Method 2 - Scan QR</div>
                <div class="text-xs text-gray-400" data-translate="use_camera">Use Camera</div>
            </div>
        </button>
        <div class="pt-2 flex justify-center gap-4">
            <button onclick="app.handleAuthClick()"
                class="text-xs text-gray-400 hover:text-gray-600 underline" data-translate="admin_login_link">Admin Click Here</button>
            <button onclick="app.setView('register')"
                class="text-xs text-blue-500 hover:text-blue-700 underline" data-translate="register">Register</button>
        </div>
    </div>
</div>
</template>

<!-- REGISTER -->
<template id="tpl-register">
<div class="max-w-md mx-auto mt-8 bg-white p-8 rounded-2xl shadow-xl border fade-in relative">
    <button onclick="app.setView('home')" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600">
        <i data-lucide="arrow-left" width="20"></i>
    </button>
    <h2 class="text-2xl font-bold mb-6 text-center">Create Account</h2>

    <!-- Tab -->
    <div class="flex gap-2 mb-6 bg-gray-100 p-1 rounded-lg">
        <button id="tab-login-btn" onclick="app.showAuthTab('login')"
            class="flex-1 py-2 rounded-md text-sm font-medium bg-white shadow">Login</button>
        <button id="tab-reg-btn" onclick="app.showAuthTab('register')"
            class="flex-1 py-2 rounded-md text-sm font-medium text-gray-500">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="auth-login-panel">
        <button onclick="app.googleLogin()"
            class="w-full mb-4 flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 py-2.5 rounded-lg hover:bg-gray-50 font-medium shadow-sm">
            Sign in with Google
        </button>
        <div class="relative flex py-2 items-center mb-4">
            <div class="flex-grow border-t"></div><span class="flex-shrink-0 mx-4 text-xs text-gray-400">Or email</span><div class="flex-grow border-t"></div>
        </div>
        <form onsubmit="app.handleEmailAuth(event)" class="space-y-3">
            <div id="auth-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-200"></div>
            <input type="email" id="email" class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email" required>
            <input type="password" id="password" class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Password" required>
            <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 font-medium" data-translate="login_btn">Login</button>
        </form>
    </div>

    <!-- Register Form -->
    <div id="auth-register-panel" class="hidden">
        <form onsubmit="app.handleRegister(event)" class="space-y-3">
            <div id="reg-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-200"></div>
            <input type="text" id="reg-name" class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your Name" required>
            <input type="email" id="reg-email" class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email" required>
            <input type="password" id="reg-password" class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Password (min 6 chars)" minlength="6" required>
            <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-lg hover:bg-green-700 font-medium">Create Account</button>
        </form>
    </div>
</div>
</template>

<!-- LOGIN (redirect to register) -->
<template id="tpl-login">
<div class="max-w-md mx-auto mt-8 bg-white p-8 rounded-2xl shadow-xl border fade-in relative">
    <button onclick="app.setView('home')" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600">
        <i data-lucide="arrow-left" width="20"></i>
    </button>
    <h2 class="text-2xl font-bold mb-2 text-center" data-translate="admin_login">Admin Login</h2>
    <button onclick="app.googleLogin()"
        class="w-full mb-6 mt-4 flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 py-2.5 rounded-lg hover:bg-gray-50 font-medium shadow-sm">
        Sign in with Google
    </button>
    <div class="relative flex py-2 items-center mb-6">
        <div class="flex-grow border-t"></div><span class="flex-shrink-0 mx-4 text-gray-400 text-sm">Or with Email</span><div class="flex-grow border-t"></div>
    </div>
    <form onsubmit="app.handleEmailAuth(event)" class="space-y-4">
        <div id="auth-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-200"></div>
        <input type="email" id="email" class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email" required>
        <input type="password" id="password" class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Password" required>
        <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 font-medium" data-translate="login_btn">Login</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">No account? <button onclick="app.setView('register')" class="text-blue-600 underline">Sign Up</button></p>
</div>
</template>

<!-- COMPANY SELECT -->
<template id="tpl-company-select">
<div class="max-w-md mx-auto mt-8 fade-in">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800" data-translate="select_company">Select Company</h2>
        <button onclick="app.logout()" class="text-sm text-red-500 hover:text-red-700">Logout</button>
    </div>
    <div id="company-list-select" class="space-y-3 mb-6"></div>
    <div class="relative flex py-2 items-center mb-4">
        <div class="flex-grow border-t"></div><span class="flex-shrink-0 mx-4 text-xs text-gray-400">OR</span><div class="flex-grow border-t"></div>
    </div>
    <button onclick="app.setView('onboarding')"
        class="w-full p-4 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:border-blue-400 hover:text-blue-600 transition-all text-sm font-medium">
        + Create or Join a New Company
    </button>
</div>
</template>

<!-- ONBOARDING -->
<template id="tpl-onboarding">
<div class="max-w-md mx-auto mt-8 fade-in">
    <div class="flex items-center gap-3 mb-6">
        <button onclick="app.userCompanies?.length ? app.setView('company-select') : app.setView('home')"
            class="text-gray-400 hover:text-gray-600"><i data-lucide="arrow-left" width="20"></i></button>
        <h2 class="text-xl font-bold text-gray-800">Set Up Your Workspace</h2>
    </div>

    <!-- Tab -->
    <div class="flex gap-2 mb-6 bg-gray-100 p-1 rounded-lg">
        <button id="ob-tab-create-btn" onclick="app.showObTab('create')"
            class="flex-1 py-2 rounded-md text-sm font-medium bg-white shadow">Create Company</button>
        <button id="ob-tab-join-btn" onclick="app.showObTab('join')"
            class="flex-1 py-2 rounded-md text-sm font-medium text-gray-500">Join with Code</button>
    </div>

    <!-- Create -->
    <div id="ob-create-panel">
        <form onsubmit="app.createCompany(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-translate="company_name">Company Name</label>
                <input type="text" id="ob-company-name" required
                    class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="e.g. My Business Co.">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-translate="your_name">Your Name</label>
                <input type="text" id="ob-user-name" required
                    class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Your display name">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-medium">
                Create &amp; Get Started
            </button>
        </form>
    </div>

    <!-- Join -->
    <div id="ob-join-panel" class="hidden">
        <form onsubmit="app.joinCompany(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-translate="invite_code">Invite Code</label>
                <input type="text" id="ob-invite-code" required
                    class="w-full border px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 uppercase font-mono"
                    placeholder="INV-XXXXXX">
            </div>
            <button type="submit"
                class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-medium">
                Join Company
            </button>
        </form>
    </div>
</div>
</template>

<!-- DASHBOARD -->
<template id="tpl-dashboard">
<div class="fade-in">
    <!-- Header -->
    <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <button onclick="app.setView('home')" class="text-gray-500 hover:text-gray-800 flex items-center gap-1 text-sm">
            <i data-lucide="arrow-left" width="16"></i> <span data-translate="home">Home</span>
        </button>
        <div class="flex items-center gap-2">
            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-medium" id="company-badge"></span>
            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full capitalize" id="role-badge"></span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="app.setView('company-select')" class="text-xs text-gray-500 hover:text-gray-700 flex items-center gap-1">
                <i data-lucide="building-2" width="14"></i> Switch
            </button>
            <button onclick="app.logout()" class="text-red-500 hover:text-red-700 text-xs font-medium flex items-center gap-1">
                <i data-lucide="log-out" width="14"></i> <span data-translate="logout">Logout</span>
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex overflow-x-auto gap-2 mb-6 pb-2 scrollbar-hide">
        <button onclick="app.switchTab('invoice')"   id="tab-invoice"   class="tab-btn whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium bg-white border shadow-sm" data-translate="invoices">Invoices</button>
        <button onclick="app.switchTab('quotation')" id="tab-quotation" class="tab-btn whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50" data-translate="quotations">Quotations</button>
        <button onclick="app.switchTab('contract')"  id="tab-contract"  class="tab-btn whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50" data-translate="contracts">Contracts</button>
        <button onclick="app.switchTab('customer')"  id="tab-customer"  class="tab-btn whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50" data-translate="customers">Customers</button>
        <button onclick="app.switchTab('expense')"   id="tab-expense"   class="tab-btn whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50" data-translate="expenses">Expenses</button>
        <button onclick="app.switchTab('salary')"    id="tab-salary"    class="tab-btn whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50">Salary</button>
        <button onclick="app.switchTab('report')"    id="tab-report"    class="tab-btn whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50" data-translate="reports">Reports</button>
        <button onclick="app.setView('members')"     class="whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50" data-translate="members">Members</button>
        <button onclick="app.setView('settings')"    class="whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50">
            <i data-lucide="settings" width="16" class="inline"></i>
        </button>
    </div>

    <!-- Filters -->
    <div id="generic-filters" class="hidden flex-wrap gap-2 mb-4 items-end bg-gray-100 p-3 rounded-lg border">
        <div>
            <label class="block text-xs font-medium text-gray-500" data-translate="year">Year</label>
            <select id="filter-year" class="border p-1.5 rounded text-sm w-24"></select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500" data-translate="month">Month</label>
            <select id="filter-month" class="border p-1.5 rounded text-sm w-32">
                <option value="all">All Months</option>
                <option value="0">January</option><option value="1">February</option><option value="2">March</option>
                <option value="3">April</option><option value="4">May</option><option value="5">June</option>
                <option value="6">July</option><option value="7">August</option><option value="8">September</option>
                <option value="9">October</option><option value="10">November</option><option value="11">December</option>
            </select>
        </div>
        <div id="filter-customer-wrapper">
            <label class="block text-xs font-medium text-gray-500" data-translate="customer">Customer</label>
            <select id="filter-customer" class="border p-1.5 rounded text-sm w-40"><option value="all">All Customers</option></select>
        </div>
        <div id="filter-status-wrapper" class="hidden">
            <label class="block text-xs font-medium text-gray-500" data-translate="status">Status</label>
            <select id="filter-status" class="border p-1.5 rounded text-sm w-32">
                <option value="all">All Status</option>
                <option value="paid">Paid</option><option value="pending">Pending</option>
                <option value="partial">Partial</option><option value="refunded">Refunded</option>
            </select>
        </div>
        <button onclick="app.applyFilters()" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm" data-translate="filter_btn">Filter</button>
    </div>

    <!-- Action bar -->
    <div id="action-bar" class="flex justify-end mb-4">
        <button onclick="app.handleCreateButtonClick()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm text-sm">
            <i data-lucide="plus" width="16"></i>
            <span id="create-btn-text">Create New</span>
        </button>
    </div>

    <!-- Content -->
    <div class="bg-white rounded-xl shadow overflow-hidden border min-h-[400px]">
        <div id="dashboard-content" class="overflow-x-auto"></div>
    </div>
</div>
</template>

<!-- MEMBERS -->
<template id="tpl-members">
<div class="fade-in">
    <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <button onclick="app.setView('dashboard')" class="text-gray-500 hover:text-gray-800 flex items-center gap-1 text-sm">
            <i data-lucide="arrow-left" width="16"></i> Back
        </button>
        <h2 class="font-bold text-gray-800" data-translate="members">Members</h2>
        <div></div>
    </div>
    <div class="bg-white rounded-xl shadow overflow-hidden border min-h-[400px]">
        <div id="members-content" class="overflow-x-auto"></div>
    </div>
</div>
</template>

<!-- CREATE (Invoice / Quotation) -->
<template id="tpl-create">
<div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-lg border fade-in">
    <div class="flex justify-between items-center mb-6 border-b pb-2">
        <h2 class="text-xl font-bold" id="form-title">Create New</h2>
        <span id="form-mode-badge" class="px-2 py-1 bg-gray-100 text-xs rounded uppercase font-bold text-gray-500">MODE</span>
    </div>
    <form onsubmit="app.handleSave(event)" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Document No.</label>
                <input type="text" id="doc-number" class="w-full border p-2 rounded bg-gray-50 font-mono uppercase" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                <input type="date" id="creation-date" class="w-full border p-2 rounded" required>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Customer ID</label>
                <input type="text" id="client-id-input" list="customer-ids" onchange="app.fillCustomerById(this.value)"
                    class="w-full border p-2 rounded uppercase" placeholder="CUST-XXX">
                <datalist id="customer-ids"></datalist>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-translate="client_name">Client Name</label>
                <input type="text" id="client-name" list="customer-list" onchange="app.fillCustomerInfo(this.value)"
                    required class="w-full border p-2 rounded" placeholder="Name...">
                <datalist id="customer-list"></datalist>
            </div>
            <input type="hidden" id="client-db-id">
            <input type="hidden" id="client-email-hidden">
            <input type="hidden" id="client-phone-hidden">
            <input type="hidden" id="client-address-hidden">
        </div>
        <div id="client-details" class="hidden text-xs text-gray-500 p-2 bg-gray-50 rounded border">
            <span id="client-phone"></span> | <span id="client-address"></span>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Note / Reference</label>
            <input type="text" id="doc-note" class="w-full border p-2 rounded text-sm" placeholder="Ref, note...">
        </div>
        <div id="items-container">
            <label class="block text-sm font-medium text-gray-700 mb-2" data-translate="items">Items</label>
        </div>
        <button type="button" onclick="app.addItem()" class="text-sm text-blue-600 font-medium flex items-center gap-1">
            <i data-lucide="plus"></i> <span data-translate="add_item">Add Item</span>
        </button>
        <div class="border-t pt-4 bg-gray-50 p-4 rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-600" data-translate="subtotal">Subtotal:</span>
                <span class="font-medium" id="subtotal-display">0</span>
            </div>
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-600" data-translate="discount">Discount (Ks):</span>
                <input type="number" id="discount-input" value="0" min="0" class="border p-1 w-32 text-right rounded" onchange="app.updateCalc(this.value,'discount')">
            </div>
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-600">Tax (%):</span>
                <input type="number" id="tax-input" value="0" min="0" step="0.1" class="border p-1 w-32 text-right rounded" onchange="app.updateCalc(this.value,'tax')">
            </div>
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-600">Service Fee (Ks):</span>
                <input type="number" id="service-fee" value="0" min="0" class="border p-1 w-32 text-right rounded" onchange="app.updateCalc(this.value,'service')">
            </div>
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-600">Service Note:</span>
                <input type="text" id="service-desc" class="border p-1 w-48 rounded text-sm" placeholder="e.g. Delivery fee">
            </div>

<script type="module">
    import app from './app.js';

    // Expose helpers on app needed by templates
    app.showAuthTab = (tab) => {
        const lp = document.getElementById('auth-login-panel');
        const rp = document.getElementById('auth-register-panel');
        const lb = document.getElementById('tab-login-btn');
        const rb = document.getElementById('tab-reg-btn');
        if (!lp || !rp) return;
        if (tab === 'login') {
            lp.classList.remove('hidden'); rp.classList.add('hidden');
            lb.className = lb.className.replace('text-gray-500','') + ' bg-white shadow';
            rb.className = rb.className.replace('bg-white shadow','') + ' text-gray-500';
        } else {
            lp.classList.add('hidden'); rp.classList.remove('hidden');
            rb.className = rb.className.replace('text-gray-500','') + ' bg-white shadow';
            lb.className = lb.className.replace('bg-white shadow','') + ' text-gray-500';
        }
    };

    app.showObTab = (tab) => {
        const cp = document.getElementById('ob-create-panel');
        const jp = document.getElementById('ob-join-panel');
        const cb = document.getElementById('ob-tab-create-btn');
        const jb = document.getElementById('ob-tab-join-btn');
        if (!cp || !jp) return;
        if (tab === 'create') {
            cp.classList.remove('hidden'); jp.classList.add('hidden');
            cb.className = cb.className.replace('text-gray-500','') + ' bg-white shadow';
            jb.className = jb.className.replace('bg-white shadow','') + ' text-gray-500';
        } else {
            cp.classList.add('hidden'); jp.classList.remove('hidden');
            jb.className = jb.className.replace('text-gray-500','') + ' bg-white shadow';
            cb.className = cb.className.replace('bg-white shadow','') + ' text-gray-500';
        }
    };

    // Patch setView to update company/role badges
    const origSetView = app.setView.bind(app);
    app.setView = (v) => {
        origSetView(v);
        if (v === 'dashboard') {
            setTimeout(() => {
                const cb = document.getElementById('company-badge');
                const rb = document.getElementById('role-badge');
                if (cb) cb.innerText = app.state?.companyData?.name || state?.companyData?.name || '';
                if (rb) rb.innerText = app.state?.userRole || state?.userRole || '';
            }, 50);
        }
    };

    // Make state accessible for migration button template literal
    window.state = {};
    Object.defineProperty(window.state, 'companyId', { get: () => app._state?.companyId });

    app.init();
</script>
